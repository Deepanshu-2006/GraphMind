<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 550" width="100%" height="100%" style="background:#0a0a0a; border-radius:8px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .text-title { font-size: 15px; font-weight: 600; fill: #F5F5F5; letter-spacing: -0.01em; }
      .text-sub { font-size: 11px; fill: #7A7A7A; }
      .text-sec-header { font-size: 10px; font-weight: 600; fill: #8A8A8A; letter-spacing: 0.08em; }
      .text-body { font-size: 11px; fill: #A1A1A1; line-height: 1.45; }
      .text-tech { font-size: 9.5px; fill: #E5E5E5; }
      .accent-num { font-size: 11px; font-weight: 600; fill: #A3FF12; letter-spacing: 0.05em; }
      .stage-card { fill: #101010; stroke: #202020; stroke-width: 1; rx: 6px; }
      .stage-card-active { fill: #111410; stroke: #263319; stroke-width: 1; rx: 6px; }
      .inner-card { fill: #141414; stroke: #1E1E1E; stroke-width: 1; rx: 4px; }
      .inner-card-active { fill: #141812; stroke: #223018; stroke-width: 1; rx: 4px; }
      .badge-bg { fill: #1A1A1A; stroke: #2A2A2A; stroke-width: 0.8; rx: 3px; }
      .badge-bg-active { fill: #1C2417; stroke: #324621; stroke-width: 0.8; rx: 3px; }
      
      /* Subtle GitHub-compatible pulse on dataflow spine */
      @keyframes pulseFlow {
        0% { stroke-dashoffset: 24; }
        100% { stroke-dashoffset: 0; }
      }
      .flow-anim {
        animation: pulseFlow 3s linear infinite;
      }
    </style>

    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8 5 L 1 8.5 z" fill="#A3FF12" fill-opacity="0.7" />
    </marker>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="0.5" y="0.5" width="1179" height="549" rx="8" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="1" />

