<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 520" width="100%" height="100%" style="background:#0a0a0a; border-radius:8px; font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono', SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .text-title { font-size: 15px; font-weight: 600; fill: #F5F5F5; letter-spacing: -0.01em; }
      .text-sub { font-size: 11px; fill: #7A7A7A; }
      .text-sec-header { font-size: 10px; font-weight: 600; fill: #8A8A8A; letter-spacing: 0.08em; }
      .text-body { font-size: 9.5px; fill: #9E9E9E; line-height: 1.4; }
      .text-tech-name { font-size: 11px; font-weight: 600; fill: #F5F5F5; }
      .text-tech-accent { font-size: 11px; font-weight: 600; fill: #A3FF12; }
      .accent-num { font-size: 11px; font-weight: 600; fill: #A3FF12; letter-spacing: 0.05em; }
      .bay-card { fill: #101010; stroke: #202020; stroke-width: 1; rx: 6px; }
      .tech-item { fill: #141414; stroke: #1E1E1E; stroke-width: 1; rx: 4px; }
      .tech-item-active { fill: #131711; stroke: #223018; stroke-width: 1; rx: 4px; }
      .version-badge { fill: #1A1A1A; stroke: #2A2A2A; stroke-width: 0.8; rx: 3px; }
      .version-badge-accent { fill: #1B2615; stroke: #314620; stroke-width: 0.8; rx: 3px; }
      
      @keyframes travelGlow {
        0% { stroke-dashoffset: 40; }
        100% { stroke-dashoffset: 0; }
      }
      .track-anim {
        animation: travelGlow 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Canvas Outer Border -->
  <rect x="0.5" y="0.5" width="1179" height="519" rx="8" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="1" />

  <!-- ========================================================================= -->
  <!-- TOP BRAND HEADER                                                          -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 28)">
    <!-- Tech Stack Lattice Glyph -->
    <rect x="0" y="2" width="20" height="20" rx="4" fill="#141414" stroke="#242424" stroke-width="1" />
    <circle cx="6" cy="8" r="2" fill="#A3FF12" />
    <circle cx="14" cy="8" r="2" fill="#F5F5F5" />
    <circle cx="10" cy="16" r="2" fill="#777777" />
    <line x1="6" y1="8" x2="14" y2="8" stroke="#A3FF12" stroke-width="1" stroke-opacity="0.8" />
    <line x1="6" y1="8" x2="10" y2="16" stroke="#555555" stroke-width="1" />
    <line x1="14" y1="8" x2="10" y2="16" stroke="#555555" stroke-width="1" />

    <!-- Title & System Subtitle -->
    <text x="32" y="12" fill="#F5F5F5" font-size="14" font-weight="600" letter-spacing="-0.02em">GraphMind</text>
    <text x="108" y="12" fill="#5A5A5A" font-size="13" font-weight="400">/ Technology Stack</text>
    <text x="32" y="27" fill="#7A7A7A" font-size="11">Production Runtime Environments, Graph Engines &amp; Verified Package Versions</text>

    <!-- Right Side Meta Badge -->
    <g transform="translate(896, 2)">
      <rect x="0" y="0" width="212" height="24" rx="4" fill="#121212" stroke="#222222" stroke-width="1" />
      <circle cx="12" cy="12" r="3" fill="#A3FF12">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <text x="22" y="15" fill="#8A8A8A" class="mono" font-size="10" letter-spacing="0.04em">CLIENT RUNTIME • STRICT TYPES</text>
    </g>
  </g>

  <!-- Horizontal Tech Track Line with subtle motion -->
  <g transform="translate(0, 68)">
    <line x1="36" y1="0" x2="1144" y2="0" stroke="#1A1A1A" stroke-width="1" />
    <line x1="36" y1="0" x2="1144" y2="0" stroke="#A3FF12" stroke-width="1" stroke-opacity="0.3" stroke-dasharray="6 6" class="track-anim" />
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 1, COL 1: APPLICATION FRAMEWORK & LANGUAGE                            -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 82)">
    <rect width="352" height="198" class="bay-card" />
    
    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">01</text>
      <text x="22" y="0" class="text-sec-header mono">FRAMEWORK &amp; TYPE SYSTEM</text>
    </g>

    <!-- Tech Item 1: React 19 -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">React</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#F5F5F5">^19.2.8</text>
      </g>
      <text x="12" y="34" class="text-body">Component hierarchy, custom hooks &amp; concurrent UI rendering</text>
    </g>

    <!-- Tech Item 2: TypeScript -->
    <g transform="translate(14, 86)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">TypeScript</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#A3FF12">~6.0.2</text>
      </g>
      <text x="12" y="34" class="text-body">End-to-end type safety for graph topologies &amp; storage schemas</text>
    </g>

    <!-- Tech Item 3: Vite -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Vite &amp; @vitejs/plugin-react</text>
      <g transform="translate(262, 8)">
        <rect width="50" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#F5F5F5">^8.3.0</text>
      </g>
      <text x="12" y="34" class="text-body">Ultra-fast HMR development server &amp; production bundler</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 1, COL 2: GRAPH VISUALIZATION & 3D SCENE                              -->
  <!-- ========================================================================= -->
  <g transform="translate(414, 82)">
    <rect width="352" height="198" class="bay-card" />

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">02</text>
      <text x="22" y="0" class="text-sec-header mono">GRAPH VISUALIZATION &amp; 3D</text>
    </g>

    <!-- Tech Item 1: @xyflow/react -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item-active" />
      <text x="12" y="18" class="text-tech-accent">@xyflow/react</text>
      <g transform="translate(244, 8)">
        <rect width="68" height="16" class="version-badge-accent" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">^12.12.0</text>
      </g>
      <text x="12" y="34" class="text-body" fill="#B5C4AE">Infinite pan/zoom canvas, force physics &amp; custom node renderers</text>
    </g>

    <!-- Tech Item 2: Three.js -->
    <g transform="translate(14, 86)">
      <rect width="324" height="46" class="tech-item-active" />
      <text x="12" y="18" class="text-tech-accent">Three.js (WebGL)</text>
      <g transform="translate(248, 8)">
        <rect width="64" height="16" class="version-badge-accent" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">^0.186.1</text>
      </g>
      <text x="12" y="34" class="text-body" fill="#B5C4AE">Procedural humanoid 3D geometry, custom shaders &amp; orbital scene</text>
    </g>

    <!-- Tech Item 3: Framer Motion -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Framer Motion</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#F5F5F5">^14.0.0</text>
      </g>
      <text x="12" y="34" class="text-body">Fluid drawer transitions, score dials &amp; layout morphing</text>
    </g>
  </g>

