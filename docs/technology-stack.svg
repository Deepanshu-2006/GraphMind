      <text x="12" y="18" class="text-tech-name">Text Normalization Engine</text>
      <g transform="translate(246, 8)">
        <rect width="66" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#888888">IN-HOUSE</text>
      </g>
      <text x="12" y="34" class="text-body">Strips headers, footers, soft hyphens &amp; noisy filler words</text>
    </g>

    <!-- Tech Item 3: Sliding Window Chunker -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Sliding Window Chunker</text>
      <g transform="translate(246, 8)">
        <rect width="66" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#888888">IN-HOUSE</text>
      </g>
      <text x="12" y="34" class="text-body">Partitions text into 500-1000 word overlapping chunks</text>
    </g>
  </g>

