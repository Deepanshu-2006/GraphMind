      <g transform="translate(248, 8)">
        <rect width="64" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#F5F5F5">^6.4.299</text>
      </g>
      <text x="12" y="34" class="text-body">Client-side multi-page PDF text extraction via dedicated worker</text>
