  <!-- ROW 2, COL 1: AI & SEMANTIC SYNTHESIS                                     -->
  <!-- ========================================================================= -->
  <g transform="translate(36, 296)">
    <rect width="352" height="198" class="bay-card" />

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">04</text>
      <text x="22" y="0" class="text-sec-header mono">AI &amp; SEMANTIC SYNTHESIS</text>
    </g>

    <!-- Tech Item 1: Gemini API -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item-active" />
      <text x="12" y="18" class="text-tech-accent">Google Gemini API</text>
      <g transform="translate(208, 8)">
        <rect width="104" height="16" class="version-badge-accent" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">gemini-1.5-flash</text>
      </g>
      <text x="12" y="34" class="text-body" fill="#B5C4AE">Structured JSON concept extraction &amp; typed relationship discovery</text>
    </g>

    <!-- Tech Item 2: Local Heuristic Fallback -->
    <g transform="translate(14, 86)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Deterministic Heuristics</text>
      <g transform="translate(240, 8)">
        <rect width="72" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">ZERO-KEY</text>
      </g>
      <text x="12" y="34" class="text-body">Offline candidate extraction requiring zero external API key</text>
    </g>

    <!-- Tech Item 3: Verbatim Source Grounding -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Source Provenance Anchor</text>
      <g transform="translate(246, 8)">
        <rect width="66" height="16" class="version-badge" />
        <text x="7" y="11" class="mono" font-size="9" fill="#888888">IN-HOUSE</text>
      </g>
      <text x="12" y="34" class="text-body">Anchors definitions to verbatim excerpts to prevent hallucinations</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 2, COL 2: PERSISTENCE & EXPORT                                        -->
  <!-- ========================================================================= -->
  <g transform="translate(414, 296)">
    <rect width="352" height="198" class="bay-card" />

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">05</text>
      <text x="22" y="0" class="text-sec-header mono">PERSISTENCE &amp; EXPORT</text>
    </g>

    <!-- Tech Item 1: LocalStorage Architecture -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Browser LocalStorage</text>
      <g transform="translate(230, 8)">
        <rect width="82" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">LOCAL-FIRST</text>
      </g>
      <text x="12" y="34" class="text-body">Local-first graph state, revision logs &amp; assessment persistence</text>
    </g>

    <!-- Tech Item 2: Multi-Graph Isolation -->
    <g transform="translate(14, 86)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Multi-Graph Isolation</text>
      <g transform="translate(240, 8)">
        <rect width="72" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#888888">graphId KEY</text>
      </g>
      <text x="12" y="34" class="text-body">Strict boundary isolation preventing cross-material leakage</text>
    </g>

    <!-- Tech Item 3: html-to-image -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">html-to-image</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#F5F5F5">^1.11.13</text>
      </g>
      <text x="12" y="34" class="text-body">High-resolution PNG &amp; SVG snapshot export for study sheets</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ROW 2, COL 3: TESTING & QUALITY TOOLCHAIN                                 -->
  <!-- ========================================================================= -->
  <g transform="translate(792, 296)">
    <rect width="352" height="198" class="bay-card" />

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">06</text>
      <text x="22" y="0" class="text-sec-header mono">QUALITY &amp; ICONOGRAPHY</text>
    </g>

    <!-- Tech Item 1: Oxlint -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Oxlint</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#A3FF12">^1.81.0</text>
      </g>
      <text x="12" y="34" class="text-body">Rust-based static code analyzer executing in milliseconds</text>
    </g>

    <!-- Tech Item 2: Node Test Runner -->
    <g transform="translate(14, 86)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Node Test Runner (tsx)</text>
      <g transform="translate(236, 8)">
        <rect width="76" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#F5F5F5">tsx --test</text>
      </g>
      <text x="12" y="34" class="text-body">Native unit &amp; integration tests for graph state &amp; storage</text>
    </g>

    <!-- Tech Item 3: Lucide React -->
    <g transform="translate(14, 138)">
      <rect width="324" height="46" class="tech-item" />
      <text x="12" y="18" class="text-tech-name">Lucide React</text>
      <g transform="translate(254, 8)">
        <rect width="58" height="16" class="version-badge" />
        <text x="6" y="11" class="mono" font-size="9" fill="#F5F5F5">^1.49.0</text>
      </g>
      <text x="12" y="34" class="text-body">Accessible semantic iconography across all workspace views</text>
    </g>
