  <!-- ========================================================================= -->
  <g transform="translate(792, 82)">
    <rect width="352" height="198" class="bay-card" />

    <!-- Header -->
    <g transform="translate(16, 20)">
      <text x="0" y="0" class="accent-num mono">03</text>
      <text x="22" y="0" class="text-sec-header mono">DOCUMENT INGESTION PIPELINE</text>
    </g>

    <!-- Tech Item 1: PDF.js -->
    <g transform="translate(14, 34)">
      <rect width="324" height="46" class="tech-item" />
